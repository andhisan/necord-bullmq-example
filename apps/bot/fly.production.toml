# fly.toml app configuration file generated for necordbullmqbot-production on 2025-10-04T18:50:00+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'necordbullmqbot-production'
primary_region = 'nrt'

[build]
  dockerfile = '../../Dockerfile.bot'

[env]
  APP_ENV = 'production'
  DISCORD__DEVELOPER_USER_ID = '1131918303913312266'
  LOG_LEVEL = 'error'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = "15s"
  interval = "10s"
  method = "GET"
  timeout = "5s"
  path = "/up"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
